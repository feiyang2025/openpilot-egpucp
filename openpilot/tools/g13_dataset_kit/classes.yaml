# G13 起步包 · 专用检测头数据集(主动避让20261112.md §6.6)
# 类别索引与 openpilot/cereal SmallObjectTrack.cls 一一对应(WIRE 枚举 0-6)
# 7=unknown 不训练——推理侧低置信兜底,不进数据集
names:
  0: adult        # 成人 站立可见高 ≥1.45 m(修订25 签收;1.40-1.45 m 按目标实高仍可标,由 50 档逻辑处理)
  1: child        # 儿童 (1.0,1.4] m(修订24 签收下界 1.0)
  2: cyclist      # 骑行者(自行车;三轮/电动车按两轮目标标)
  3: motorcycle   # 摩托/燃油两轮(与 cyclist 分开——速度包络不同)
  4: animal      # 宠物/动物(猫犬为主)
  5: cone        # 雪糕桶/交通锥(含倒伏)
  6: debris      # 路面色块状碎片(轮胎皮/纸箱/泡沫/散落物;非"路牌/杆",杆不入此集)
# 继承性建议:先 COCO 预训练权重热启(同你 tl 模型的做法:pretrained yolov8n),
# 类别差异大,建议从头训 head、冻结 backbone 前 10 epoch。
